name: paper-quantum-ising-networks
channels:
  - conda-forge
dependencies:
  - python=3.15.0
  - cairosvg=2.9.1
  - colorcet=3.2.1
  - ffmpeg=9.0.2  # not imported: matplotlib writes the movies with it
